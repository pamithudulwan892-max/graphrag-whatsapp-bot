services:
  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:7860"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bot-data:
