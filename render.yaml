# Render Blueprint: one free web service running the Docker image (API + webhooks + dashboard).
services:
  - type: web
    name: graphrag-whatsapp-bot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SEED_SAMPLE_DOCS
        value: "true"
      - key: USE_RERANKER
        value: "false"
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
